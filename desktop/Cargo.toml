[package]
name = "kostomp-desktop"
version = "1.0.24"
edition = "2021"
description = "Desktop window for the omp stats dashboard"

# Standalone workspace: keeps this crate out of the upstream root Cargo workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
