<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kostomp</title>
<link rel="stylesheet" href="glass.css">
<style>
  :root { --fg:var(--ink-1); --dim:var(--ink-2); --line:var(--line-2); --bar:var(--warn); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { padding: 12px; box-sizing: border-box; }
  .card {
    position: relative; height: 100%; box-sizing: border-box; display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px; border-radius: 16px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    cursor: pointer; overflow: hidden; animation: glass-enter 180ms ease-out; transform-origin: bottom right;
  }
  .card:hover { background-image: linear-gradient(var(--hover), var(--hover)); }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card.out { opacity: 0; transform: translateY(10px); transition: opacity .18s, transform .18s; }
  img { width: 36px; height: 36px; border-radius: 10px; flex: none; }
  .text { min-width: 0; flex: 1; padding-right: 18px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { margin-top: 2px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .x {
    position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border: 0; border-radius: 6px; padding: 0;
    background: transparent; color: var(--dim); cursor: pointer; opacity: 0; transition: opacity .12s;
  }
  .card:hover .x { opacity: 1; }
  .x:hover { background: var(--hover); color: var(--fg); }
  .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--bar); transform-origin: left; animation: drain 8s linear forwards; }
  .card:hover .bar { animation-play-state: paused; }
  @keyframes drain { to { transform: scaleX(0); } }
  .card.glass{background:var(--glass-tint);color:var(--ink-1)}
  .x:focus-visible{opacity:1}
  @media(prefers-reduced-transparency:reduce){.card.glass{background:var(--panel)}}
  @media(prefers-reduced-motion:reduce){.card,.card.out,.bar{animation:none;transition:none}}
</style>
</head>
<body>
<div class="card glass" id="card">
  <img src="logo.png" alt="">
  <div class="text"><div class="title" id="title"></div><div class="body" id="body"></div></div>
  <button class="x" id="x" aria-label="Dismiss">✕</button>
  <div class="bar" id="bar"></div>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const q = new URLSearchParams(location.search);
  const sid = q.get("sid") ?? "";
  document.getElementById("title").textContent = q.get("title") ?? "Kostomp";
  document.getElementById("body").textContent = q.get("body") ?? "";
  const card = document.getElementById("card");
  const close = () => { card.classList.add("out"); setTimeout(() => invoke("toast_close"), 180); };
  card.addEventListener("click", () => invoke("toast_activate", { sid }));
  document.getElementById("x").addEventListener("click", (e) => { e.stopPropagation(); close(); });
  document.getElementById("bar").addEventListener("animationend", close);
</script>
</body>
</html>
